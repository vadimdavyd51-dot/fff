<body style="margin:0;padding:0;">
<style>
  :root{
    --bg: #17181A;
    --bg-panel: rgba(255,255,255,0.045);
    --bg-panel-solid: #1F2023;
    --panel-border: rgba(255,255,255,0.09);
    --chalk: #F2EFE9;
    --chalk-dim: #8B8D91;
    --line: rgba(255,255,255,0.09);
    --up: #2A9D8F;
    --down: #E6484F;
    --plate-1: #E63946;
    --plate-2: #3A6EA5;
    --plate-3: #F2B705;
    --plate-4: #2A9D8F;
    --plate-5: #9B5DE5;
    --plate-6: #F4845F;
    --glow-soft: 0 8px 28px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  .app{
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 25% -5%, rgba(90,100,120,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 15%, rgba(60,50,80,0.12), transparent 55%),
      linear-gradient(180deg, #1B1C1F 0%, #131417 45%, #0E0F11 100%);
    color: var(--chalk);
    height: 100vh;
    height: 100dvh;
    min-height: 640px;
    width: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* стеклянные панели: полупрозрачный фон + блюр + мягкая тень, единая точка настройки */
  :where(.chip, .load-pill, .rest-pill, .stat-card, .sheet, .style-card, .band-row,
    .exercise-row, .muscle-chip, .band-chip, .rest-preset-chip, .step-btn, .gear-btn,
    .undo-btn, .add-exercise-btn, .exercise-list, .today-sets, .custom-input-row,
    .trash-zone, .day-detail-row, .formula-box, .rest-adjust-btn, .load-type-tab){
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--glow-soft);
  }

  /* ---------- top bar ---------- */
  .topbar{
    padding: 16px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .exercise-name{
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--chalk-dim);
  }
  .exercise-name b{ color: var(--chalk); }

  .plate-stack{
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 22px;
    min-width: 20px;
  }
  .plate{
    width: 7px;
    border-radius: 2px;
    animation: pop 0.25s ease;
  }
  @keyframes pop{
    from{ transform: scaleY(0); opacity:0; }
    to{ transform: scaleY(1); opacity:1; }
  }

  /* ---------- tabs ---------- */
  .tabs{
    display: flex;
    margin: 4px 16px 10px;
    background: var(--bg-panel);
    border-radius: 12px;
    padding: 3px;
    gap: 3px;
    flex: none;
  }
  .tab{
    flex: 1;
    text-align: center;
    padding: 9px 0;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--chalk-dim);
  }
  .tab.active{
    background: var(--chalk);
    color: var(--bg);
    box-shadow: 0 4px 18px rgba(242,239,233,0.18);
  }

  /* ---------- load / rest pills ---------- */
  .pills-row{
    display: flex;
    gap: 8px;
    padding: 0 16px 8px;
    flex: none;
  }
  .load-pill{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 11px 14px;
    font-size: 14px;
    font-weight: 700;
  }
  .load-pill .load-icon{ font-size: 16px; }
  .load-pill .load-edit{
    margin-left: auto;
    font-size: 11px;
    font-weight: 700;
    color: var(--chalk-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .rest-pill{
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 11px 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--chalk-dim);
  }

  /* ---------- rest countdown ---------- */
  .rest-active{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: 100%;
  }
  .rest-label{
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;

<script>

  const EXERCISE_LIBRARY = {

        'Спина': ['Становая тяга', 'Тяга штанги в наклоне', 'Тяга гантели в наклоне одной рукой', 'Тяга верхнего блока', 'Тяга нижнего блока', 'Шраги со штангой', 'Гиперэкстензия'],
        'Ноги': ['Приседания со штангой', 'Румынская тяга', 'Выпады со штангой', 'Приседания с гантелями', 'Жим ногами в тренажёре', 'Разгибание ног в тренажёре', 'Сгибание ног лёжа', 'Подъём на носки (икры)'],
        'Плечи': ['Жим штанги стоя', 'Жим гантелей сидя', 'Разведение гантелей в стороны', 'Разведение гантелей в наклоне', 'Тяга штанги к подбородку', 'Разведение в тренажёре (дельты)'],
        'Руки': ['Подъём штанги на бицепс', 'Подъём гантелей на бицепс', 'Молотки с гантелями', 'Французский жим штанги', 'Французский жим гантели', 'Разгибание на трицепс на блоке', 'Отжимания на брусьях с весом'],
        'Пресс': ['Скручивания с весом', 'Русский твист с гантелей', 'Подъём ног в висе с весом']
      }
    },
    bodyweight: {
      label: '🧍 Тело',
      groups: {
        'Грудь и трицепс': ['Отжимания классические', 'Отжимания широким хватом', 'Отжимания узким хватом', 'Отжимания на брусьях', 'Отжимания на одной руке'],
        'Спина и бицепс': ['Подтягивания широким хватом', 'Подтягивания узким хватом', 'Подтягивания обратным хватом', 'Австралийские подтягивания'],
        'Ноги и ягодицы': ['Приседания классические', 'Пистолетик (на одной ноге)', 'Выпады', 'Болгарские сплит-приседания', 'Ягодичный мостик', 'Подъём на носки'],
        'Плечи': ['Пайк-отжимания', 'Отжимания в стойке на руках'],
        'Пресс и кор': ['Планка', 'Скручивания', 'Подъём ног в висе', 'Велосипед', 'Уголок']
      }
    },
    band: {
      label: '➰ Резина',
      groups: {
        'Грудь': ['Жим резины от груди', 'Разведение резины перед собой'],
        'Спина': ['Тяга резины к поясу', 'Тяга резины сверху', 'Разведение резины в наклоне'],
        'Ноги и ягодицы': ['Приседания с резиной', 'Ходьба с резиной боком', 'Ягодичный мостик с резиной', 'Разгибание ноги назад с резиной'],
        'Плечи': ['Жим резины вверх', 'Разведение резины в стороны', 'Тяга резины к подбородку'],
        'Руки': ['Сгибание рук с резиной (бицепс)', 'Разгибание рук с резиной (трицепс)'],
        'Пресс': ['Скручивания с резиной']
      }
    }
  };

  function defaultLoadForCategory(cat){
    if(cat === 'free') return { type: 'free', weight: 20 };
    if(cat === 'band') return { type: 'band', bands: [] };
    return { type: 'bodyweight', added: 0 };
  }

  // доля собственного веса, реально работающая в движении (биомеханическая оценка)
  const BODYWEIGHT_COEFFICIENTS = {
    'Отжимания классические': 0.64,
    'Отжимания широким хватом': 0.64,
    'Отжимания узким хватом': 0.68,
    'Отжимания на брусьях': 1.00,
    'Отжимания на одной руке': 0.90,
    'Подтягивания широким хватом': 1.00,
    'Подтягивания узким хватом': 1.00,
    'Подтягивания обратным хватом': 1.00,
    'Австралийские подтягивания': 0.55,
    'Приседания классические': 0.88,
    'Пистолетик (на одной ноге)': 0.98,
    'Выпады': 0.85,
    'Болгарские сплит-приседания': 0.88,
    'Ягодичный мостик': 0.45,
    'Подъём на носки': 0.60,
    'Пайк-отжимания': 0.70,
    'Отжимания в стойке на руках': 1.00,
    'Планка': 0.50,
    'Скручивания': 0.35,
    'Подъём ног в висе': 0.40,
    'Велосипед': 0.35,
    'Уголок': 0.55
  };
  const DEFAULT_BW_COEF = 0.65;
  function defaultCoefFor(name){
    return BODYWEIGHT_COEFFICIENTS[name] !== undefined ? BODYWEIGHT_COEFFICIENTS[name] : DEFAULT_BW_COEF;
  }

  const STORAGE_KEY = 'reps-data-v3';
  const OLD_KEY_V2 = 'reps-data-v2';
  const OLD_KEY_V1 = 'reps-session';

  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function dateStrOf(ts){
    const d = new Date(ts);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function startOfWeek(d){
    const dt = new Date(d);
    const day = dt.getDay();
    const diff = (day === 0 ? -6 : 1) - day;
    dt.setDate(dt.getDate() + diff);
    dt.setHours(0,0,0,0);
    return dt;
  }
  function weekKey(ts){ return dateStrOf(startOfWeek(new Date(ts)).getTime()); }
  function monthKey(ts){
    const d = new Date(ts);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  }
  function weekLabel(key){
    const [y,m,dd] = key.split('-').map(Number);
    const start = new Date(y, m-1, dd);
    const end = new Date(start); end.setDate(end.getDate()+6);
    const fmt = (d) => d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0');
    return fmt(start)+'–'+fmt(end);
  }
  function monthLabel(key){
    const names = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
    const [y,m] = key.split('-').map(Number);
    return names[m-1];
  }
  function dayLabel(key){
    const [y,m,dd] = key.split('-').map(Number);
    return dd + '.' + String(m).padStart(2,'0');
  }
  function dayLabelFull(key){
    const names = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
    const [y,m,dd] = key.split('-').map(Number);
    const todayKey = todayStr();
    const yd = new Date(); yd.setDate(yd.getDate()-1);
    const yesterdayKey = dateStrOf(yd.getTime());
    if(key === todayKey) return 'Сегодня, ' + dd + ' ' + names[m-1];
    if(key === yesterdayKey) return 'Вчера, ' + dd + ' ' + names[m-1];
    return dd + ' ' + names[m-1];
  }

  function loadWeight(load){
    if(!load) return 0;
    if(load.type === 'free') return load.weight || 0;
    if(load.type === 'bodyweight'){
      const coef = load.coef !== undefined ? load.coef : 1; // старые записи (до коэффициента) считаем как есть
      return ((load.bodyweight || 0) + (load.added || 0)) * coef;
    }
    if(load.type === 'band') return (load.bands || []).reduce((s,b) => s + bandPoints(b), 0);
    return 0;
  }
  function loadUnit(type){
    return type === 'band' ? 'баллов' : 'кг';
  }
  function loadLabel(load){
    if(!load) return '—';
    if(load.type === 'free') return (load.weight || 0) + ' кг';
    if(load.type === 'bodyweight') return 'тело' + (load.added ? ' +' + load.added + 'кг' : '');
    if(load.type === 'band'){
      const counts = {};
      (load.bands || []).forEach(b => {
        if(typeof b !== 'string') return; // старые числовые записи (до системы баллов) больше не показываем
        counts[b] = (counts[b] || 0) + 1;
      });
      const parts = Object.keys(counts).map(key => {
        const def = bandByKey(key);
        const name = def ? def.name : key;
        return counts[key] > 1 ? `${name}×${counts[key]}` : name;
      });
      return parts.join('+') || '—';
    }
    return '—';
  }
  function loadIcon(type){
    if(type === 'free') return '🏋️';
    if(type === 'bodyweight') return '🧍';
    if(type === 'band') return '➰';
    return '•';
  }

  let state = {
    exercises: [
      { name: 'Отжимания', color: PLATE_COLORS[0], lastLoad: { type: 'bodyweight', added: 0 } },
      { name: 'Приседания', color: PLATE_COLORS[1], lastLoad: { type: 'bodyweight', added: 0 } }
    ],
    activeIndex: 0,
    count: 0,
    sessionRest: 90,
    sets: [], // { ex, reps, time, load }
    bodyweight: null,
    presets: [],
    customExercises: []
  };

  let loaded = false;
  let showAddSheet = false;
  let showLoadSheet = false;
  let showRestSheet = false;
  let view = 'counter';
  let loadDraft = null;
  let restDraft = 90;
  let addCategory = 'free';
  let addMuscle = null;

  let phase = 'welcome'; // welcome | setup | workout
  let selectedStatsDay = null;
  let setupStep = 1;
  let setupStyle = null;
  let setupRest = 90;
  let setupSelected = {}; // key(lowercased name) -> { name, category }
  let setupCategory = 'free';
  let setupMuscle = null;
  let editingPresetId = null;
  let showPresetNameSheet = false;
  let presetNameDraft = '';
  let confirmModal = null; // { text, onConfirm, confirmLabel, cancelLabel, danger }

  const STYLES = [
    { key: 'free', icon: '🏋️', title: 'Силовая', desc: 'Штанга, гантели, тренажёры' },
    { key: 'bodyweight', icon: '🤸', title: 'Своим телом', desc: 'Отжимания, подтягивания, приседания' },
    { key: 'band', icon: '➰', title: 'С резиной', desc: 'Эспандер, фитнес-резина' },
    { key: 'mixed', icon: '🔀', title: 'Смешанная', desc: 'Комбинируй всё сразу' }
  ];

  let rest = { active: false, remaining: 0, total: 0, timer: null, ringing: false };
  let sirenInterval = null;

  const REST_PRESETS = [15, 30, 45, 60, 90, 120, 150, 180, 240];

  function fmtTime(sec){
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function playSiren(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.connect(g); g.connect(ctx.destination);

      const t0 = ctx.currentTime;
      const duration = 2.6;
      const cycles = 4;
      const low = 500, high = 1050;

      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.08);

      o.frequency.setValueAtTime(low, t0);
      for(let i = 0; i < cycles; i++){
        const segStart = t0 + (i * duration / cycles);
        const segMid = segStart + duration / cycles / 2;
        const segEnd = segStart + duration / cycles;
        o.frequency.linearRampToValueAtTime(high, segMid);
        o.frequency.linearRampToValueAtTime(low, segEnd);
      }

      g.gain.setValueAtTime(0.35, t0 + duration - 0.15);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

      o.start(t0);
      o.stop(t0 + duration);
    }catch(e){}
  }

  function startSirenLoop(){
    vibrate([500,150,500,150,500,150,500]);
    playSiren();
    sirenInterval = setInterval(() => {
      vibrate([500,150,500,150,500,150,500]);
      playSiren();
    }, 2900);
  }
  function stopSirenLoop(){
    if(sirenInterval){ clearInterval(sirenInterval); sirenInterval = null; }
  }

  function clearRestTimer(){
    if(rest.timer){ clearInterval(rest.timer); rest.timer = null; }
  }

  function startRest(seconds){
    clearRestTimer();
    stopSirenLoop();
    rest.active = true;
    rest.ringing = false;
    rest.total = seconds;
    rest.remaining = seconds;
    rest.timer = setInterval(() => {
      rest.remaining -= 1;
      if(rest.remaining <= 0){
        clearRestTimer();
        rest.remaining = 0;
        rest.ringing = true;
        startSirenLoop();
        render();
        return;
      }
      render();
    }, 1000);
    render();
  }

  function skipRest(){
    clearRestTimer();
    stopSirenLoop();
    rest.active = false;
    rest.ringing = false;
    render();
  }

  function confirmRestDone(){
    stopSirenLoop();
    rest.active = false;
    rest.ringing = false;
    render();
  }

  function adjustRest(delta){
    rest.remaining = Math.max(0, rest.remaining + delta);
    if(rest.remaining > rest.total) rest.total = rest.remaining;
    if(rest.remaining === 0){
      clearRestTimer();
      rest.ringing = true;
      startSirenLoop();
    }
    render();
  }

  function openRestSheet(){
    restDraft = state.sessionRest || 90;
    showRestSheet = true;
    render();
  }
  function saveRestSheet(){
    state.sessionRest = restDraft;
    showRestSheet = false;
    saveState();
    render();
  }

  const root = document.getElementById('root');

  function migrate(){
    try{
      let raw = localStorage.getItem(OLD_KEY_V2);
      if(raw){
        const old = JSON.parse(raw);
        localStorage.removeItem(OLD_KEY_V2);
        return {
          exercises: old.exercises.map(e => ({ name: e.name, color: e.color, lastLoad: { type: 'bodyweight', added: 0 } })),
          activeIndex: old.activeIndex || 0,
          count: old.count || 0,
          sets: (old.sets || []).map(s => ({ ex: s.ex, reps: s.reps, time: s.time, load: { type: 'bodyweight', added: 0 } })),
          bodyweight: null
        };
      }
      raw = localStorage.getItem(OLD_KEY_V1);
      if(raw){
        const old = JSON.parse(raw);
        localStorage.removeItem(OLD_KEY_V1);
        const exercises = old.exercises.map(e => ({ name: e.name, color: e.color, lastLoad: { type: 'bodyweight', added: 0 } }));
        const sets = [];
        old.exercises.forEach((e, idx) => (e.sets || []).forEach(s => sets.push({ ex: idx, reps: s.reps, time: s.time, load: { type: 'bodyweight', added: 0 } })));
        return { exercises, activeIndex: old.activeIndex || 0, count: old.count || 0, sets, bodyweight: null };
      }
    }catch(e){}
    return null;
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        state = JSON.parse(raw);
      } else {
        const migrated = migrate();
        if(migrated) state = migrated;
      }
    }catch(e){}

    // бэкфилл: коэффициент нагрузки для упражнений собственного веса, созданных до этой версии
    let backfilled = false;
    (state.exercises || []).forEach(ex => {
      if(ex.lastLoad && ex.lastLoad.type === 'bodyweight' && ex.bodyweightCoef === undefined){
        ex.bodyweightCoef = defaultCoefFor(ex.name);
        backfilled = true;
      }
    });
    (state.sets || []).forEach(s => {
      if(s.load && s.load.type === 'bodyweight' && s.load.coef === undefined){
        const ex = state.exercises[s.ex];
        if(ex){
          s.load.coef = defaultCoefFor(ex.name);
          backfilled = true;
        }
      }
    });
    if(backfilled) saveState();

    loaded = true;
    render();
  }

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('save failed', e); }
  }

  function startSetup(){
    setupStep = 1;
    setupStyle = null;
    setupRest = 90;
    setupSelected = {};
    setupCategory = 'free';
    setupMuscle = Object.keys(EXERCISE_LIBRARY.free.groups)[0];
    editingPresetId = null;
    phase = 'setup';
    render();
  }

  function startFromPreset(preset){
    const indices = [];
    preset.exercises.forEach(({name, category}) => {
      let idx = state.exercises.findIndex(e => e.name.trim().toLowerCase() === name.trim().toLowerCase());
      if(idx === -1){
        const color = PLATE_COLORS[state.exercises.length % PLATE_COLORS.length];
        const newEx = { name, color, lastLoad: defaultLoadForCategory(category) };
        if(category === 'bodyweight') newEx.bodyweightCoef = defaultCoefFor(name);
        state.exercises.push(newEx);
        idx = state.exercises.length - 1;
      }
      indices.push(idx);
    });
    state.sessionIndices = indices;
    state.sessionStyle = preset.style;
    state.sessionRest = preset.rest;
    state.activeIndex = indices[0];
    state.count = 0;
    saveState();
    phase = 'workout';
    view = 'counter';
    render();
  }

  function editPreset(preset){
    editingPresetId = preset.id;
    setupStyle = preset.style;
    setupRest = preset.rest;
    setupSelected = {};
    preset.exercises.forEach(e => { setupSelected[e.name.trim().toLowerCase()] = e; });
    setupCategory = (preset.style && preset.style !== 'mixed') ? preset.style : 'free';
    setupMuscle = Object.keys(EXERCISE_LIBRARY[setupCategory].groups)[0];
    setupStep = 3; // стиль и отдых уже заданы пресетом — сразу к упражнениям
    phase = 'setup';
    render();
  }

  function openConfirmModal(text, onConfirm, opts){
    opts = opts || {};
    confirmModal = {
      text,
      onConfirm,
      confirmLabel: opts.confirmLabel || 'Да',
      cancelLabel: opts.cancelLabel || 'Нет',
      danger: opts.danger !== false
    };
    render();
  }
  function closeConfirmModal(){
    confirmModal = null;
    render();
  }
  function runConfirmModal(){
    const action = confirmModal && confirmModal.onConfirm;
    confirmModal = null;
    if(action) action();
  }
  function renderConfirmModalHTML(){
    if(!confirmModal) return '';
    return `
      <div class="overlay overlay-center" id="confirmOverlay">
        <div class="confirm-box" onclick="event.stopPropagation()">
          <p>${escapeHtml(confirmModal.text)}</p>
          <div class="confirm-actions">
            <button class="no" id="confirmNoBtn">${escapeHtml(confirmModal.cancelLabel)}</button>
            <button class="yes ${confirmModal.danger?'danger':''}" id="confirmYesBtn">${escapeHtml(confirmModal.confirmLabel)}</button>
          </div>
        </div>
      </div>
    `;
  }
  function bindConfirmModalEvents(){
    if(!confirmModal) return;
    document.getElementById('confirmOverlay').addEventListener('click', closeConfirmModal);
    document.getElementById('confirmNoBtn').addEventListener('click', closeConfirmModal);
    document.getElementById('confirmYesBtn').addEventListener('click', runConfirmModal);
  }

  function deletePreset(id, name){
    openConfirmModal('Вы точно хотите удалить пресет?', () => {
      state.presets = (state.presets || []).filter(p => p.id !== id);
      saveState();
      render();
    }, { danger: true });
  }

  function openPresetNameSheet(){
    const existing = editingPresetId ? (state.presets || []).find(p => p.id === editingPresetId) : null;
    presetNameDraft = existing ? existing.name : '';
    showPresetNameSheet = true;
    render();
  }

  function savePresetWithName(){
    const name = presetNameDraft.trim();
    if(!name) return;
    const items = Object.values(setupSelected);
    if(items.length === 0) return;
    if(!state.presets) state.presets = [];
    const preset = {
      id: editingPresetId || ('preset_' + Date.now()),
      name,
      style: setupStyle,
      rest: setupRest,
      exercises: items.map(i => ({ name: i.name, category: i.category }))
    };
    const idx = state.presets.findIndex(p => p.id === preset.id);
    if(idx !== -1) state.presets[idx] = preset; else state.presets.push(preset);
    editingPresetId = preset.id;
    saveState();
    showPresetNameSheet = false;
    render();
  }

  function toggleSetupExercise(name, category){
    const key = name.trim().toLowerCase();
    if(setupSelected[key]) delete setupSelected[key];
    else setupSelected[key] = { name, category };
    render();
  }

  function addCustomExerciseToLibrary(name, category, muscle){
    if(!state.customExercises) state.customExercises = [];
    const key = name.trim().toLowerCase();
    const exists = state.customExercises.some(c => c.category === category && c.muscle === muscle && c.name.trim().toLowerCase() === key);
    if(!exists){
      state.customExercises.push({ name: name.trim(), category, muscle });
      saveState();
    }
    // сразу отмечаем как выбранное — но теперь оно видно строкой в списке, а не только «в уме»
    setupSelected[key] = { name: name.trim(), category };
    render();
  }

  function finishSetup(){
    const items = Object.values(setupSelected);
    if(items.length === 0) return;
    const indices = [];
    items.forEach(({name, category}) => {
      let idx = state.exercises.findIndex(e => e.name.trim().toLowerCase() === name.trim().toLowerCase());
      if(idx === -1){
        const color = PLATE_COLORS[state.exercises.length % PLATE_COLORS.length];
        const newEx = { name, color, lastLoad: defaultLoadForCategory(category) };
        if(category === 'bodyweight') newEx.bodyweightCoef = defaultCoefFor(name);
        state.exercises.push(newEx);
        idx = state.exercises.length - 1;
      }
      indices.push(idx);
    });
    state.sessionIndices = indices;
    state.sessionStyle = setupStyle;
    state.sessionRest = setupRest;
    state.activeIndex = indices[0];
    state.count = 0;
    saveState();
    phase = 'workout';
    view = 'counter';
    render();
  }

  let vibrateWarned = false;
  function vibrate(ms){
    const fn = navigator.vibrate || navigator.webkitVibrate || navigator.mozVibrate;
    if(!fn){
      if(!vibrateWarned){ console.warn('[vibrate] Vibration API недоступно в этом WebView.'); vibrateWarned = true; }
      return;
    }
    try{
      const ok = fn.call(navigator, ms);
      if(ok === false && !vibrateWarned){
        console.warn('[vibrate] navigator.vibrate() вернул false — скорее всего, нет разрешения VIBRATE в APK или выключена вибрация в настройках телефона.');
        vibrateWarned = true;
      }
    }catch(e){
      if(!vibrateWarned){ console.warn('[vibrate] ошибка вызова:', e); vibrateWarned = true; }
    }
  }

  function currentLoad(){
    const ex = state.exercises[state.activeIndex];
    return ex.lastLoad || { type: 'bodyweight', added: 0 };
  }

  function increment(){
    state.count += 1;
    vibrate(12);
    saveState();
    render(true);
  }
  function decrement(){
    if(state.count > 0){ state.count -= 1; vibrate(8); saveState(); render(); }
  }

  function finishSet(){
    if(state.count === 0) return;
    const ex = state.exercises[state.activeIndex];
    const load = JSON.parse(JSON.stringify(currentLoad()));
    if(load.type === 'bodyweight'){
      load.bodyweight = state.bodyweight || 0;
      load.coef = defaultCoefFor(ex.name);
    }
    state.sets.push({ ex: state.activeIndex, reps: state.count, time: Date.now(), load });
    state.count = 0;
    vibrate([10,40,10]);
    saveState();
    startRest(state.sessionRest || 90);
  }

  function deleteExercise(idx){
    if(state.exercises.length <= 1){ alert('Должно остаться хотя бы одно упражнение.'); return; }
    const name = state.exercises[idx].name;
    state.sets = state.sets
      .filter(s => s.ex !== idx)
      .map(s => ({ ...s, ex: s.ex > idx ? s.ex - 1 : s.ex }));
    state.exercises.splice(idx, 1);
    if(state.sessionIndices){
      state.sessionIndices = state.sessionIndices
        .filter(i => i !== idx)
        .map(i => i > idx ? i - 1 : i);
    }
    if(state.activeIndex === idx){
      state.activeIndex = (state.sessionIndices && state.sessionIndices.length) ? state.sessionIndices[0] : 0;
    } else if(state.activeIndex > idx){
      state.activeIndex -= 1;
    }
    state.count = 0;
    const key = name.trim().toLowerCase();
    if(setupSelected[key]) delete setupSelected[key];
    saveState();
    render();
  }

  function deleteExerciseByName(name){
    const idx = state.exercises.findIndex(e => e.name.trim().toLowerCase() === name.trim().toLowerCase());
    if(idx !== -1) deleteExercise(idx);
  }

  function attachChipDrag(el, idx){
    const LONG_PRESS_MS = 420;
    const MOVE_CANCEL = 10;
    const TRASH_SIZE = 66;
    const TRASH_BOTTOM = 70;
    const HIT_RADIUS = 60;
    let timer = null;
    let startX = 0, startY = 0;
    let dragging = false;
    let clone = null;
    let trash = null;
    let pointerId = null;

    function trashCenter(){
      return {
        x: window.innerWidth / 2,
        y: window.innerHeight - TRASH_BOTTOM - TRASH_SIZE / 2
      };
    }

    function cleanup(){
      if(timer){ clearTimeout(timer); timer = null; }
      if(clone){ clone.remove(); clone = null; }
      if(trash){ trash.remove(); trash = null; }
      el.classList.remove('chip-lifted');
      if(pointerId !== null){
        try{ el.releasePointerCapture(pointerId); }catch(e){}
        pointerId = null;
      }
      dragging = false;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
    }

    function beginDrag(){
      dragging = true;
      vibrate(20);
      const rect = el.getBoundingClientRect();
      clone = el.cloneNode(true);
      clone.classList.add('chip-drag-clone');
      clone.style.left = rect.left + 'px';
      clone.style.top = rect.top + 'px';
      clone.style.width = rect.width + 'px';
      document.body.appendChild(clone);
      el.classList.add('chip-lifted');

      trash = document.createElement('div');
      trash.className = 'trash-zone visible';
      trash.style.width = TRASH_SIZE + 'px';
      trash.style.height = TRASH_SIZE + 'px';
      trash.style.bottom = TRASH_BOTTOM + 'px';
      trash.textContent = '🗑';
      document.body.appendChild(trash);
    }

    function isOverTrash(x, y){
      const c = trashCenter();
      return Math.hypot(x - c.x, y - c.y) < HIT_RADIUS;
    }

    function onMove(e){
      const x = e.clientX, y = e.clientY;
      if(!dragging){
        if(Math.abs(x - startX) > MOVE_CANCEL || Math.abs(y - startY) > MOVE_CANCEL){
          cleanup();
        }
        return;
      }
      e.preventDefault();
      clone.style.left = (x - clone.offsetWidth/2) + 'px';
      clone.style.top = (y - clone.offsetHeight/2) + 'px';
      if(trash) trash.classList.toggle('over', isOverTrash(x, y));
    }

    function onUp(e){
      if(dragging){
        const x = e.clientX, y = e.clientY;
        const over = isOverTrash(x, y);
        cleanup();
        if(over) deleteExercise(idx);
      } else {
        cleanup();
        selectExercise(idx);
      }
    }

    el.style.webkitTouchCallout = 'none';
    el.addEventListener('pointerdown', (e) => {
      if(e.button !== undefined && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY;
      pointerId = e.pointerId;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      timer = setTimeout(beginDrag, LONG_PRESS_MS);
      document.addEventListener('pointermove', onMove, { passive: false });
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  }

  function selectExercise(i){
    state.activeIndex = i;
    state.count = 0;
    selectedStatsDay = null;
    if(rest.active && !rest.ringing){ clearRestTimer(); rest.active = false; }
    saveState();
    render();
  }

  function addExercise(name, category){
    const existingIdx = state.exercises.findIndex(e => e.name.trim().toLowerCase() === name.trim().toLowerCase());
    if(existingIdx !== -1){
      state.activeIndex = existingIdx;
      state.count = 0;
      if(!state.sessionIndices) state.sessionIndices = [];
      if(!state.sessionIndices.includes(existingIdx)) state.sessionIndices.push(existingIdx);
      showAddSheet = false;
      saveState();
      render();
      return;
    }
    const color = PLATE_COLORS[state.exercises.length % PLATE_COLORS.length];
    const lastLoad = defaultLoadForCategory(category || 'bodyweight');
    const newEx = { name, color, lastLoad };
    if((category || 'bodyweight') === 'bodyweight') newEx.bodyweightCoef = defaultCoefFor(name);
    state.exercises.push(newEx);
    const newIdx = state.exercises.length - 1;
    if(!state.sessionIndices) state.sessionIndices = [];
    state.sessionIndices.push(newIdx);
    state.activeIndex = newIdx;
    state.count = 0;
    showAddSheet = false;
    saveState();
    render();
  }

  function resetAllStats(){
    state.sets = [];
    state.count = 0;
    selectedStatsDay = null;
    saveState();
    render();
  }

  function setsForExercise(idx){ return state.sets.filter(s => s.ex === idx); }

  function aggregateVolume(sets, keyFn){
    const map = {};
    sets.forEach(s => { const k = keyFn(s.time); map[k] = (map[k] || 0) + loadWeight(s.load) * s.reps; });
    return map;
  }

  function renderStatCard(title, current, previous, currentLabel, prevLabel, unit){
    const delta = previous > 0 ? Math.round(((current - previous) / previous) * 100) : (current > 0 ? 100 : 0);
    let cls = 'flat', arrow = '•', text = 'нет данных за прошлый период';
    if(previous > 0 || current > 0){
      if(current > previous){ cls = 'up'; arrow = '▲'; text = '+' + delta + '%'; }
      else if(current < previous){ cls = 'down'; arrow = '▼'; text = delta + '%'; }
      else { cls = 'flat'; arrow = '='; text = '0%'; }
    }
    return `
      <div class="stat-card">
        <h4>${title}</h4>
        <div class="stat-row">
          <span class="stat-value">${Math.round(current*10)/10}<small> ${unit}</small></span>
          <span class="stat-delta ${cls}">${arrow} ${text}</span>
        </div>
        <div class="stat-sub">${currentLabel} · прошлый период (${prevLabel}): ${Math.round(previous*10)/10} ${unit}</div>
      </div>
    `;
  }

  function renderBars(entries, labelFn, color, interactive){
    if(entries.length === 0) return '';
    const max = Math.max(...entries.map(e => e[1]), 1);
    return `<div class="bars">${entries.map(([k,v]) => `
      <div class="bar-col" ${interactive ? `data-day="${k}"` : ''} style="${interactive ? 'cursor:pointer;' : ''}">
        <div class="bar ${interactive && k===selectedStatsDay ? 'bar-selected' : ''}" style="height:${Math.max(3,(v/max)*100)}%; background:${color}"></div>
        <div class="bar-label">${labelFn(k)}</div>
      </div>`).join('')}</div>`;
  }

  function renderDayDetail(sets, day, ex){
    const daySets = sets.filter(s => dateStrOf(s.time) === day);
    if(daySets.length === 0) return '';
    const unit = loadUnit(ex.lastLoad && ex.lastLoad.type);
    const dayVolume = daySets.reduce((s,x) => s + loadWeight(x.load)*x.reps, 0);
    const rows = daySets.map((s,i) => `
      <div class="day-detail-row">
        <span class="day-detail-set">Подход ${i+1}</span>
        <span class="day-detail-reps">${s.reps} повт.</span>
        <span class="day-detail-load">${loadLabel(s.load)}</span>
      </div>
    `).join('');
    return `
      <div class="stat-card" id="dayDetailCard">
        <h4>${dayLabelFull(day)}</h4>
        <div class="day-detail-list">${rows}</div>
        <div class="stat-sub" style="margin-top:8px;">Итого: ${Math.round(dayVolume*10)/10} ${unit} за день</div>
      </div>
    `;
  }

  function renderWeekProgressBanner(sets, unit){
    const now = Date.now();
    const curWeek = weekKey(now);
    const pwd = new Date(now); pwd.setDate(pwd.getDate()-7);
    const prevWeek = weekKey(pwd.getTime());

    const curSets = sets.filter(s => weekKey(s.time) === curWeek);
    const prevSets = sets.filter(s => weekKey(s.time) === prevWeek);
    if(prevSets.length === 0) return ''; // нечего сравнивать

    const curSetsCount = curSets.length, prevSetsCount = prevSets.length;
    const curReps = curSets.reduce((a,s)=>a+s.reps,0), prevReps = prevSets.reduce((a,s)=>a+s.reps,0);
    const curVol = curSets.reduce((a,s)=>a+loadWeight(s.load)*s.reps,0), prevVol = prevSets.reduce((a,s)=>a+loadWeight(s.load)*s.reps,0);

    const volLabel = unit === 'баллов' ? 'Баллы' : 'Тоннаж';
    const items = [
      { label: 'Подходы', cur: curSetsCount, prev: prevSetsCount, suffix: '' },
      { label: 'Повторения', cur: curReps, prev: prevReps, suffix: '' },
      { label: volLabel, cur: Math.round(curVol*10)/10, prev: Math.round(prevVol*10)/10, suffix: ' ' + unit }
    ];
    const improved = items.filter(i => i.cur > i.prev);
    if(improved.length === 0) return '';

    return `
      <div class="stat-card" style="border-color:var(--up); background:rgba(42,157,143,0.08);">
        <h4 style="color:var(--up);">🔥 Прогресс на этой неделе</h4>
        ${improved.map(i => `<div class="stat-sub" style="margin-bottom:5px;">✅ ${i.label} больше: <b style="color:var(--chalk);">${i.cur}${i.suffix}</b> против ${i.prev}${i.suffix} на прошлой неделе</div>`).join('')}
      </div>
    `;
  }

  function renderStats(ex, idx){
    const sets = setsForExercise(idx);
    if(sets.length === 0){
      return `<div class="empty-stat">Пока нет подходов по «${escapeHtml(ex.name)}».<br>Заверши хотя бы один подход, чтобы увидеть статистику.</div>`;
    }
    const unit = loadUnit(ex.lastLoad && ex.lastLoad.type);

    const now = Date.now();
    const curWeek = weekKey(now);
    const pwd = new Date(now); pwd.setDate(pwd.getDate()-7);
    const prevWeek = weekKey(pwd.getTime());
    const curMonth = monthKey(now);
    const pmd = new Date(now); pmd.setMonth(pmd.getMonth()-1);
    const prevMonth = monthKey(pmd.getTime());

    const byWeek = aggregateVolume(sets, weekKey);
    const byMonth = aggregateVolume(sets, monthKey);
    const byDay = aggregateVolume(sets, dateStrOf);

    const weekCard = renderStatCard('Эта неделя vs прошлая', byWeek[curWeek]||0, byWeek[prevWeek]||0, weekLabel(curWeek), weekLabel(prevWeek), unit);
    const monthCard = renderStatCard('Этот месяц vs прошлый', byMonth[curMonth]||0, byMonth[prevMonth]||0, monthLabel(curMonth), monthLabel(prevMonth), unit);

    const weekKeys = Object.keys(byWeek).sort().slice(-8);
    const monthKeys = Object.keys(byMonth).sort().slice(-6);
    const dayKeys = Object.keys(byDay).sort().slice(-14);
    const weekBars = renderBars(weekKeys.map(k=>[k,byWeek[k]]), weekLabel, ex.color);
    const monthBars = renderBars(monthKeys.map(k=>[k,byMonth[k]]), monthLabel, ex.color);
    const dayBars = renderBars(dayKeys.map(k=>[k,byDay[k]]), dayLabel, ex.color, true);

    if(selectedStatsDay && !dayKeys.includes(selectedStatsDay)) selectedStatsDay = null;
    const dayDetail = selectedStatsDay ? renderDayDetail(sets, selectedStatsDay, ex) : '';

    const totalVolume = sets.reduce((s,x) => s + loadWeight(x.load)*x.reps, 0);
    const totalReps = sets.reduce((s,x) => s + x.reps, 0);
    const totalSets = sets.length;

    return `
      ${renderWeekProgressBanner(sets, unit)}
      ${weekCard}
      ${monthCard}
      <div class="stat-card"><h4>Объём по дням (${unit}) · тапни на день</h4>${dayBars}</div>
      ${dayDetail}
      <div class="stat-card"><h4>Объём по неделям (${unit})</h4>${weekBars}</div>
      <div class="stat-card"><h4>Объём по месяцам (${unit})</h4>${monthBars}</div>
      <div class="stat-card">
        <h4>Всего за всё время</h4>
        <div class="stat-row"><span class="stat-value">${Math.round(totalVolume*10)/10}<small> ${unit}</small></span></div>
        <div class="stat-sub">${totalReps} повторений · ${totalSets} подход${totalSets===1?'':totalSets<5?'а':'ов'}</div>
      </div>
    `;
  }

      }).join('');

      body = `
        <div class="field-label">Выбери резинки — можно несколько одного цвета</div>
        <div class="band-grid">${rows}</div>
        <div class="band-sum">Сумма баллов за подход: <b>${totalPoints}</b></div>
      `;
    }
    return header + body;
  }

  function bindLoadSheetEvents(){
    const freeInput = document.getElementById('freeWeightInput');
    if(freeInput) freeInput.addEventListener('input', () => { loadDraft.weight = parseFloat(freeInput.value) || 0; });
    const bwInput = document.getElementById('bodyweightInput');
    if(bwInput) bwInput.addEventListener('input', () => { state.bodyweight = parseFloat(bwInput.value) || null; });
    const addedInput = document.getElementById('addedWeightInput');
    if(addedInput) addedInput.addEventListener('input', () => { loadDraft.added = parseFloat(addedInput.value) || 0; });
    document.querySelectorAll('[data-step]').forEach(el => {
      el.addEventListener('click', () => {
        const delta = parseFloat(el.dataset.step);
        if(loadDraft.type === 'free'){ loadDraft.weight = Math.max(0, (loadDraft.weight||0) + delta); }
        else if(loadDraft.type === 'bodyweight'){ loadDraft.added = Math.max(0, (loadDraft.added||0) + delta); }
        render();
      });
    });
    document.querySelectorAll('[data-bandinc]').forEach(el => {
      el.addEventListener('click', () => { loadDraft.bands.push(el.dataset.bandinc); render(); });
    });
    document.querySelectorAll('[data-banddec]').forEach(el => {
      el.addEventListener('click', () => {
        const k = el.dataset.banddec;
        const i = loadDraft.bands.indexOf(k);
        if(i !== -1) loadDraft.bands.splice(i,1);
        render();
      });
    });
  }

  function renderPreserveFocus(){
    const active = document.activeElement;
    const id = active && active.id;
    const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
    render();
    if(id){
      const el = document.getElementById(id);
      if(el){
        el.focus();
        if(selStart !== null && el.setSelectionRange){
          try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
        }
      }
    }
  }

  function syncOverlayToKeyboard(){
    if(!window.visualViewport) return;
    const h = window.visualViewport.height;
    document.querySelectorAll('.app').forEach(a => {
      a.style.height = h + 'px';
    });
    document.querySelectorAll('.overlay').forEach(o => {
      o.style.height = h + 'px';
    });
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', syncOverlayToKeyboard);
    window.visualViewport.addEventListener('scroll', syncOverlayToKeyboard);
  }
  document.addEventListener('focusin', (e) => {
    if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')){
      const el = e.target;
      setTimeout(() => {
        syncOverlayToKeyboard();
        try{ el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }catch(err){}
      }, 300);
    }
  });
  document.addEventListener('focusout', () => {
    setTimeout(syncOverlayToKeyboard, 200);
  });

  function render(bump){
    if(phase === 'welcome'){ renderWelcome(); }
    else if(phase === 'setup'){ renderSetup(); }
    else { renderWorkout(bump); }
    syncOverlayToKeyboard();
  }

  function renderWelcome(){
    const presets = state.presets || [];
    const presetCards = presets.map(p => {
      const styleInfo = STYLES.find(s => s.key === p.style);

      return `
        <div class="preset-card">
          <div class="preset-info" data-startpreset="${p.id}">
            <b>${escapeHtml(p.name)}</b>
            <span>${styleInfo ? styleInfo.icon + ' ' + styleInfo.title : ''} · ${n} ${exWord}</span>
          </div>
          <button class="preset-icon-btn" data-editpreset="${p.id}" aria-label="Изменить">✎</button>
          <button class="preset-icon-btn" data-delpreset="${p.id}" data-presetname="${escapeHtml(p.name)}" aria-label="Удалить">✕</button>
        </div>
      `;
    }).join('');

    root.innerHTML = `
      <div class="app">
        <div class="welcome">

        </div>

      </div>

    document.getElementById('startBtn').addEventListener('click', () => {

    });
    document.querySelectorAll('[data-startpreset]').forEach(el => {
      el.addEventListener('click', () => {
        try{
          const de = document.documentElement;
          const req = de.requestFullscreen || de.webkitRequestFullscreen || de.mozRequestFullScreen;
          if(req) req.call(de).catch(() => {});
        }catch(e){}
        const p = presets.find(x => x.id === el.dataset.startpreset);
        if(p) startFromPreset(p);
      });

    document.querySelectorAll('[data-editpreset]').forEach(el => {
      el.addEventListener('click', (e) => {

        if(p) editPreset(p);

    });

      el.addEventListener('click', (e) => {
        e.stopPropagation();
        deletePreset(el.dataset.delpreset, el.dataset.presetname);

  function renderSetup(){
    let title = '', sub = '', body = '';

    if(setupStep === 1){
      title = 'Выбери стиль тренировки';
      sub = 'Что сегодня в приоритете? Можно скомбинировать позже.';

        <div class="style-card ${setupStyle===s.key?'selected':''}" data-style="${s.key}">
          <span class="icon">${s.icon}</span>
          <span class="txt"><b>${s.title}</b><span>${s.desc}</span></span>
        </div>
      `).join('')}</div>`;
    } else if(setupStep === 2){
      title = 'Выбери время отдыха между подходами';
      sub = 'Можно будет поменять для каждого упражнения отдельно.';
      body = `
        <div class="rest-presets">
          ${REST_PRESETS.map(v => `<div class="rest-preset-chip ${setupRest===v?'selected':''}" data-setuprest="${v}">${fmtTime(v)}</div>`).join('')}
        </div>

        <div class="stepper-row">

      sub = setupStyle === 'mixed' ? 'Можно комбинировать любые стили.' : 'Список под твой стиль — ' + (STYLES.find(s=>s.key===setupStyle)||{}).title + '.';
      const cat = EXERCISE_LIBRARY[setupCategory];
      const muscleKeys = Object.keys(cat.groups);
      if(!setupMuscle || !cat.groups[setupMuscle]) setupMuscle = muscleKeys[0];
      const exercises = cat.groups[setupMuscle] || [];
      const customForMuscle = (state.customExercises || []).filter(c => c.category === setupCategory && c.muscle === setupMuscle);

      const catTabs = setupStyle === 'mixed' ? Object.keys(EXERCISE_LIBRARY).map(key => `
        <div class="load-type-tab ${setupCategory===key?'active':''}" data-setupcat="${key}">${EXERCISE_LIBRARY[key].label}</div>

      const muscleChips = muscleKeys.map(m => `
        <div class="muscle-chip ${setupMuscle===m?'active':''}" data-setupmuscle="${escapeHtml(m)}">${escapeHtml(m)}</div>
      `).join('');
      const presetRows = exercises.map(name => {
        const key = name.trim().toLowerCase();
        const selected = !!setupSelected[key];
        const persisted = state.exercises.some(e => e.name.trim().toLowerCase() === key);
        return `<div class="exercise-row ${selected?'already':''}" data-setupexercise="${escapeHtml(name)}" data-setupexcat="${setupCategory}">

            ${persisted ? `<span class="chip-del" data-deletebyname="${escapeHtml(name)}" style="background:var(--line);">🗑</span>` : ''}
            <span class="plus">${selected ? '✓' : '+'}</span>
          </span>
        </div>`;
      });
      const customRows = customForMuscle.map(c => {
        const key = c.name.trim().toLowerCase();
        const selected = !!setupSelected[key];
        return `<div class="exercise-row ${selected?'already':''}" data-setupexercise="${escapeHtml(c.name)}" data-setupexcat="${setupCategory}">
          <span>${escapeHtml(c.name)}</span>
          <span class="plus">${selected ? '✓' : '+'}</span>
        </div>`;
      });
      const rows = presetRows.concat(customRows).join('');

      const count = Object.keys(setupSelected).length;

      body = `

          <button class="custom-submit-btn" id="setupAddCustom" aria-label="Добавить">+</button>
        </div>
        <button class="rest-preset-chip" id="savePresetBtn" style="width:100%; text-align:center; margin-top:16px;" ${count===0?'disabled':''}>⭐ ${editingPresetId ? 'Сохранить изменения пресета' : 'Сохранить как пресет'}</button>
      `;
    }

    root.innerHTML = `
      <div class="app">
        <div class="setup ${setupStep!==3 ? 'setup-centered' : ''}">
          <div class="setup-header">
            <h2 class="setup-title">${title}</h2>
            <p class="setup-sub">${sub}</p>
          </div>
          <div class="setup-body">${body}</div>
          <div class="setup-nav">
            ${setupStep > 1 ? `<button class="back" id="setupBack">Назад</button>` : ''}
            <button class="next" id="setupNext" ${setupStep===1 && !setupStyle ? 'disabled':''} ${setupStep===3 && Object.keys(setupSelected).length===0 ? 'disabled':''}>${setupStep===3 ? 'Начать тренировку' : 'Далее'}</button>
          </div>
        </div>
        ${showPresetNameSheet ? `
        <div class="overlay overlay-center" id="presetNameOverlay">
          <div class="sheet sheet-centered" onclick="event.stopPropagation()">
            <h3>${editingPresetId ? 'Название пресета' : 'Сохранить как пресет'}</h3>
            <input id="presetNameInput" type="text" placeholder="Например: День груди" value="${escapeHtml(presetNameDraft)}" autofocus />
            <div class="sheet-actions">
              <button class="cancel" id="cancelPresetName">Отмена</button>
              <button class="save" id="confirmPresetName">Сохранить</button>
            </div>
          </div>
        </div>` : ''}
        ${renderConfirmModalHTML()}
      </div>
    `;

    const setupBackBtn = document.getElementById('setupBack');
    if(setupBackBtn) setupBackBtn.addEventListener('click', () => {
      if(setupStep > 1){ setupStep -= 1; render(); }
    });
    document.getElementById('setupNext').addEventListener('click', () => {
      if(setupStep === 1){ if(!setupStyle) return; setupStep = 2; setupCategory = setupStyle==='mixed' ? 'free' : setupStyle; setupMuscle = Object.keys(EXERCISE_LIBRARY[setupCategory].groups)[0]; render(); }
      else if(setupStep === 2){ setupStep = 3; render(); }
      else { finishSetup(); }
    });

    if(setupStep === 1){
      document.querySelectorAll('[data-style]').forEach(el => {
        el.addEventListener('click', () => { setupStyle = el.dataset.style; render(); });
      });
    } else if(setupStep === 2){
      document.querySelectorAll('[data-setuprest]').forEach(el => {
        el.addEventListener('click', () => { setupRest = parseInt(el.dataset.setuprest,10); render(); });
      });
      const input = document.getElementById('setupRestInput');
      if(input) input.addEventListener('input', () => { setupRest = Math.max(0, parseInt(input.value,10) || 0); });
      document.querySelectorAll('[data-setupreststep]').forEach(el => {
        el.addEventListener('click', () => { setupRest = Math.max(0, setupRest + parseInt(el.dataset.setupreststep,10)); render(); });
      });
    } else {
      document.querySelectorAll('[data-setupcat]').forEach(el => {
        el.addEventListener('click', () => {
          setupCategory = el.dataset.setupcat;
          setupMuscle = Object.keys(EXERCISE_LIBRARY[setupCategory].groups)[0];
          render();
        });
      });
      document.querySelectorAll('[data-setupmuscle]').forEach(el => {
        el.addEventListener('click', () => { setupMuscle = el.dataset.setupmuscle; render(); });
      });
      document.querySelectorAll('[data-setupexercise]').forEach(el => {
        el.addEventListener('click', () => toggleSetupExercise(el.dataset.setupexercise, el.dataset.setupexcat));

      document.querySelectorAll('[data-deletebyname]').forEach(el => {

      });
      document.getElementById('setupAddCustom').addEventListener('click', () => {
        const input = document.getElementById('setupCustomName');
        const name = input.value.trim();
        if(name){ addCustomExerciseToLibrary(name, setupCategory, setupMuscle); input.value=''; }
      });
      const savePresetBtn = document.getElementById('savePresetBtn');
      if(savePresetBtn) savePresetBtn.addEventListener('click', () => {
        if(editingPresetId){
          const existing = (state.presets || []).find(p => p.id === editingPresetId);
          const existingName = existing ? existing.name : '';
          openConfirmModal(`Сохранить изменения в пресете «${existingName}»?`, () => {
            presetNameDraft = existingName;
            savePresetWithName();
          }, { confirmLabel: 'Подтвердить', cancelLabel: 'Отмена', danger: false });
        } else {
          openPresetNameSheet();
        }
      });
    }

    if(showPresetNameSheet){
      document.getElementById('presetNameOverlay').addEventListener('click', () => { showPresetNameSheet = false; render(); });
      document.getElementById('cancelPresetName').addEventListener('click', () => { showPresetNameSheet = false; render(); });
      const nameInput = document.getElementById('presetNameInput');
      if(nameInput) nameInput.addEventListener('input', () => { presetNameDraft = nameInput.value; });
      document.getElementById('confirmPresetName').addEventListener('click', savePresetWithName);
    }
    bindConfirmModalEvents();
  }

  function renderWorkout(bump){
    if(!loaded){
      root.innerHTML = '<div class="app" style="align-items:center;justify-content:center;"><span class="hint">Загрузка…</span></div>';
      return;
    }

    const ex = state.exercises[state.activeIndex];
    const todaySets = setsForExercise(state.activeIndex).filter(s => dateStrOf(s.time) === todayStr());
    const load = currentLoad();

    const plates = todaySets.map(s => {
      const h = Math.min(22, 8 + s.reps);
      return `<div class="plate" style="height:${h}px; background:${ex.color}"></div>`;
    }).join('');

    const sessionIndices = state.sessionIndices && state.sessionIndices.length ? state.sessionIndices : state.exercises.map((_,i)=>i);
    const chips = sessionIndices.map(i => {
      const e = state.exercises[i];
      const icon = loadIcon(e.lastLoad && e.lastLoad.type);
      return `<div class="chip ${i===state.activeIndex?'active':''}" data-chip="${i}">
        <span class="chip-icon">${icon}</span>
        <span class="dot" style="background:${e.color}"></span>${escapeHtml(e.name)}
      </div>`;
    }).join('');

    const restPct = rest.total > 0 ? Math.max(0, Math.min(100, (rest.remaining / rest.total) * 100)) : 0;

    const controlPanel = `
      <div class="chips-row-wrap">
        <div class="chips-scroll" id="chipsRow">${chips}</div>

            <h3>Время отдыха (на всю тренировку)</h3>
            <div class="rest-presets">

    const addChip = document.querySelector('[data-add]');

      addCategory = (state.sessionStyle && state.sessionStyle !== 'mixed') ? state.sessionStyle : 'free';
      addMuscle = Object.keys(EXERCISE_LIBRARY[addCategory].groups)[0];

    if(showAddSheet){
      document.getElementById('overlay').addEventListener('click', () => { showAddSheet=false; render(); });
      document.getElementById('cancelAdd').addEventListener('click', () => { showAddSheet=false; render(); });
      document.querySelectorAll('[data-addcat]').forEach(el => {
        el.addEventListener('click', () => {
          addCategory = el.dataset.addcat;
          addMuscle = Object.keys(EXERCISE_LIBRARY[addCategory].groups)[0];
          render();
        });
      });
      document.querySelectorAll('[data-addmuscle]').forEach(el => {
        el.addEventListener('click', () => { addMuscle = el.dataset.addmuscle; render(); });
      });
      document.querySelectorAll('[data-addexercise]').forEach(el => {
        el.addEventListener('click', () => addExercise(el.dataset.addexercise, addCategory));
      });
      document.querySelectorAll('[data-deletebyname]').forEach(el => {
        el.addEventListener('click', (e) => { e.stopPropagation(); deleteExerciseByName(el.dataset.deletebyname); });
      });
      document.getElementById('saveAdd').addEventListener('click', () => {
        const input = document.getElementById('newExName');
        const name = input.value.trim();
        if(name) addExercise(name, addCategory);
      });
    }

    if(showLoadSheet){
      document.getElementById('loadOverlay').addEventListener('click', () => { showLoadSheet=false; render(); });
      document.getElementById('cancelLoad').addEventListener('click', () => { showLoadSheet=false; render(); });
      document.getElementById('saveLoad').addEventListener('click', saveLoadSheet);
      bindLoadSheetEvents();
    }

    if(showRestSheet){
      document.getElementById('restOverlay').addEventListener('click', () => { showRestSheet=false; render(); });
      document.getElementById('cancelRest').addEventListener('click', () => { showRestSheet=false; render(); });
      document.getElementById('saveRest').addEventListener('click', saveRestSheet);
      document.querySelectorAll('[data-restpreset]').forEach(el => {
        el.addEventListener('click', () => { restDraft = parseInt(el.dataset.restpreset,10); render(); });
      });
      const customInput = document.getElementById('restCustomInput');
      if(customInput) customInput.addEventListener('input', () => { restDraft = Math.max(0, parseInt(customInput.value,10) || 0); });
      document.querySelectorAll('[data-reststep]').forEach(el => {
        el.addEventListener('click', () => {
          restDraft = Math.max(0, restDraft + parseInt(el.dataset.reststep,10));
          render();
        });
      });
    }
    bindConfirmModalEvents();
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  loadState();
})();
</script>

</body>
</html>
